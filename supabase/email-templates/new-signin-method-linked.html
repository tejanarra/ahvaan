<div style="background:#FBFAF8;padding:32px 16px;font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#FFFFFF;border:1px solid #E7E4DD;border-radius:12px;" cellpadding="0" cellspacing="0">
    <tr>
      <td style="padding:32px 32px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding-right:6px;vertical-align:middle;">
              <a href="{{ .SiteURL }}"><img src="{{ .SiteURL }}/icon.png" width="20" height="20" alt="ahvaan" style="display:block;border-radius:4px;" /></a>
            </td>
            <td style="vertical-align:middle;">
              <a href="{{ .SiteURL }}" style="font-family:Georgia, 'Times New Roman', serif;font-size:18px;color:#211E19;text-decoration:none;">ahvaan</a>
            </td>
            <td style="vertical-align:middle;padding-left:8px;">
              <span style="font-size:12px;color:#6E6A61;">Invitations made easy</span>
            </td>
          </tr>
        </table>
        <h1 style="font-family:Georgia, 'Times New Roman', serif;font-weight:normal;font-size:22px;margin:24px 0 12px;color:#211E19;">A new sign-in method was linked</h1>
        <p style="font-size:16px;line-height:1.5;color:#211E19;margin:0;">Your <strong>{{ .Provider }}</strong> account was linked as a new sign-in method for <strong>{{ .Email }}</strong>.</p>
        
        <p style="margin-top:16px;font-size:14px;color:#6E6A61;line-height:1.5;">If you didn't make this change, <a href="{{ .SiteURL }}/forgot-password" style="color:#2F5D46;">reset your password</a> and contact us right away.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 28px;">
        <hr style="border:none;border-top:1px solid #E7E4DD;margin:0 0 16px;" />
        <a href="{{ .SiteURL }}" style="font-size:12px;color:#6E6A61;text-decoration:none;">ahvaan — design the invitation, share one link</a>
      </td>
    </tr>
  </table>
</div>
